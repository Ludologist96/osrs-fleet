# OSRS fleet settings. Installed to /etc/osrs/fleet.conf.
# After editing /etc/osrs/fleet.conf run:  sudo fleetctl restart all

# How many accounts (slots) this machine runs. Slot N uses:
#   Linux user botN, virtual screen :N, VNC port 5900+N, bot web UI port 8010+N
SLOTS=8

# Size of each virtual screen. RuneLite must fit fully inside it.
RESOLUTION=1280x800

# Where the code is copied to on the VM (fleetctl update refreshes it).
APP_DIR=/opt/osrs/app

# Extra Java options for RuneLite (leave empty for defaults).
JAVA_OPTS=""

# Port of the fleet dashboard (open http://localhost:<port> on Windows).
DASHBOARD_PORT=8000
