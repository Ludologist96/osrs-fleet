# OSRS fleet settings. Installed to /etc/osrs/fleet.conf.
# After editing /etc/osrs/fleet.conf run:  sudo fleetctl restart all

# How many accounts (slots) this machine runs. Slot N uses:
#   Linux user botN, virtual screen :N, VNC port 5900+N, bot web UI port 8010+N
SLOTS=8

# Size of each virtual screen. RuneLite must fit fully inside it.
RESOLUTION=1280x800

# Where the code is copied to on the VM (fleetctl update refreshes it).
APP_DIR=/opt/osrs/app

# Seconds between RuneLite starts (all at once gets rate limited by RuneLite's
# download server).
CLIENT_START_GAP=20

# Extra Java options for the RuneLite launcher (leave empty for defaults).
JAVA_OPTS=""

# Java options for the game client itself (memory cap). Empty = RuneLite's own (768 MB heap).
CLIENT_JVM_ARGS="-Xmx512m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m"

# 1 = keep the CV debug viewer (port 5555+10*N) running in every bot. Costs RAM + CPU.
CV_DEBUG=0

# Port of the fleet dashboard (open http://localhost:<port> on Windows).
DASHBOARD_PORT=8000
