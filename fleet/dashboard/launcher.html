<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSRS Fleet</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1d1b18; --muted: #6f6a62; --line: #e2ddd5;
    --ok: #2f7d4f; --warn: #b7791f; --bad: #b4382f; --idle: #8a8478; --accent: #7a5c2e;
    --screens: #0c0b0a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141311; --panel: #1e1c19; --ink: #ece8e1; --muted: #9b958b; --line: #2e2b27;
      --ok: #5cbf83; --warn: #e0a84a; --bad: #e46a5f; --idle: #8a8478; --accent: #d1a866;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
         font: 13px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  #top { flex: none; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 14px 6px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .bar > * { flex: none; }
  .bar #res { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .grow { flex: 1 1 0; }
  #bot { max-width: 150px; }
  h1 { font-size: 15px; margin: 0; }
  a { color: var(--muted); font-size: 12px; }
  .grow { flex: 1; }
  .small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .accts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .acct { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--line);
          border-radius: 7px; cursor: pointer; max-width: 210px; }
  .acct input { accent-color: var(--accent); margin: 0; }
  .acct .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct .sl { color: var(--muted); font-size: 11px; }
  .acct.off { opacity: .45; cursor: not-allowed; }
  .acct .cl { padding: 0 6px; font-size: 11px; opacity: 1; }
  .acct.off:has(.cl) { opacity: 1; }
  .acct .px { padding: 0 6px; font-size: 11px; }
  .acct .px.on { color: var(--accent); border-color: var(--accent); }
  dialog#pxd { border: 1px solid var(--line); border-radius: 8px; padding: 14px; max-width: 360px; width: calc(100% - 32px);
    background: var(--bg, #111); color: inherit; }
  dialog#pxd label { display: block; margin: 6px 0; font-size: 13px; }
  dialog#pxd input, dialog#pxd select { width: 100%; box-sizing: border-box; margin-top: 2px; }
  dialog#pxd .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  dialog#pxd pre { white-space: pre-wrap; font-size: 12px; margin: 8px 0 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 7px; }
  label.f { display: flex; align-items: center; gap: 6px; }
  select, input[type=number] { font: inherit; padding: 3px 6px; border-radius: 6px;
         border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  input[type=number] { width: 48px; }
  button { font: inherit; padding: 4px 11px; border-radius: 7px; border: 1px solid var(--line);
           background: transparent; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
  button:hover { border-color: var(--accent); }
  .runs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .run { display: flex; align-items: center; gap: 7px; padding: 3px 4px 3px 8px; border: 1px solid var(--line);
         border-radius: 7px; font-variant-numeric: tabular-nums; max-width: 100%; }
  .run .m { color: var(--muted); font-size: 11px; max-width: 260px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
  .run button { padding: 1px 7px; font-size: 12px; }
  .st { font-weight: 600; }
  .st-running { color: var(--ok); } .st-waiting, .st-starting { color: var(--warn); }
  .st-error, .st-dead { color: var(--bad); } .st-done, .st-stopped { color: var(--idle); }
  .err { color: var(--bad); }
  #top.min .hide-min { display: none; }
  /* screens */
  #grid { flex: 1; min-height: 0; background: var(--screens); display: grid; justify-content: center;
          align-content: center; gap: 2px; position: relative; overflow: hidden; }
  .tile { position: relative; overflow: hidden; background: #000; outline: 1px solid #2e2b27; }
  .tile.focus { outline: 2px solid #d1a866; z-index: 1; }
  .inner { position: absolute; }
  .lbl { position: absolute; right: 3px; bottom: 2px; padding: 1px 5px; border-radius: 4px;
         background: rgba(0,0,0,.6); color: #ece8e1; pointer-events: none; font-size: 11px; }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; color: #9b958b; text-align: center; padding: 10px; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: #9b958b; font-size: 14px; }
  /* one-row controls: dropdown panels */
  .dd { position: relative; }
  .ddb { white-space: nowrap; }
  .ddp { display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; background: var(--panel);
         border: 1px solid var(--line); border-radius: 8px; padding: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.25);
         max-height: 70vh; overflow: auto; min-width: 280px; }
  .dd.open .ddp { display: block; }
  .ddp .accts, .ddp .runs { flex-direction: column; flex-wrap: nowrap; margin-top: 0; }
  .ddp .acct { max-width: none; }
  .ddp .run .m { max-width: 340px; }
  .act { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; color: #fff; white-space: nowrap; }
  .k-good { background: #2f7d4f; } .k-pause { background: #b7791f; } .k-move { background: #3465a4; }
  .k-bad { background: #b4382f; } .k-idle { background: #6e6860; }
  .lbl { display: flex; gap: 4px; align-items: center; background: transparent; padding: 0; }
  .lbl .nm2 { background: rgba(0,0,0,.65); padding: 1px 5px; border-radius: 4px; }
  dialog#cfgd { border: 1px solid var(--line); border-radius: 8px; padding: 14px; max-width: 420px; width: calc(100% - 32px);
    background: var(--panel); color: var(--ink); }
  dialog#cfgd label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0; }
  dialog#cfgd input[type=text] { flex: 1; min-width: 0; font: inherit; padding: 3px 6px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  dialog#cfgd h3 { font-size: 13px; margin: 12px 0 4px; color: var(--muted); }
  dialog#cfgd .btns { display: flex; gap: 6px; margin-top: 12px; }
  dialog#cfgd pre { white-space: pre-wrap; font-size: 12px; margin: 8px 0 0; }
</style>
</head>
<body>
<div id="top">
  <div class="bar">
    <h1>OSRS Fleet</h1>
    <div class="dd" id="ddAcc">
      <button class="ddb" id="accBtn" title="Choose the accounts to launch">Accounts ▾</button>
      <div class="ddp">
        <div class="accts" id="accts"><span class="small">Loading accounts…</span></div>
        <div class="row"><button id="all">Select all</button><button id="none">Select none</button></div>
      </div>
    </div>
    <div class="dd" id="ddRun">
      <button class="ddb" id="runBtn" title="What every launched account is doing">Bots: – ▾</button>
      <div class="ddp">
        <div class="runs" id="runs"></div>
        <div class="row"><button id="clear">Clear finished</button><button id="stopall">Stop all</button></div>
      </div>
    </div>
    <select id="bot" title="Bot to run"></select>
    <button id="cfgopen" title="Settings of the chosen bot for the chosen accounts">⚙ Settings</button>
    <label class="f">Run for <input type="number" id="hours" min="0" max="24" step="1" value="1"> h
      <input type="number" id="mins" min="0" max="59" step="5" value="0"> min</label>
    <label class="f" title="Each account starts 1–4 min after the previous one, run times vary ±10%"><input type="checkbox" id="spread" checked> Spread out</label>
    <button class="primary" id="go">Launch</button>
    <span class="err" id="err"></span>
    <span class="grow"></span>
    <span class="small" id="res"></span>
    <a href="/">Dashboard</a>
    <button id="impopen" title="Give slots their own proxies from the list in the fleet folder">Proxies</button>
  </div>
</div>
<div id="grid"><div id="empty">Start bots above — their screens show here.</div></div>

<dialog id="pxd">
  <b id="pxt">Proxy</b>
  <div class="small" id="pxnow"></div>
  <label>Type <select id="pxs"><option value="socks5">SOCKS5</option><option value="http">HTTP</option></select></label>
  <label>Host <input id="pxh" placeholder="gw.dataimpulse.com" autocomplete="off"></label>
  <label>Port <input id="pxp" type="number" min="1" max="65535" placeholder="10009"></label>
  <label>Login <input id="pxl" autocomplete="off" placeholder="login (DataImpulse: add __cr.de for Germany)"></label>
  <label>Password <input id="pxw" type="password" autocomplete="new-password"></label>
  <div class="btns">
    <button class="primary" id="pxsave">Save + restart RuneLite</button>
    <button id="pxtest">Test IP</button>
    <button id="pxoff">Turn off</button>
    <button id="pxclose">Close</button>
  </div>
  <div class="btns">
    <button id="pxforget" title="Removes the login and the game's machine id from this slot">Forget login</button>
    <button id="pxbrowser" title="Firefox on this slot's screen, through this slot's proxy - make the account there">Open browser here</button>
    <button id="pxbclose">Close browser</button>
  </div>
  <pre id="pxout"></pre>
</dialog>
<dialog id="cfgd">
  <b id="cfgt">Settings</b>
  <div class="small" id="cfgfor"></div>
  <div id="cfgbody"></div>
  <div class="btns"><button class="primary" id="cfgsave">Save</button><button id="cfgclose">Close</button></div>
  <pre id="cfgout"></pre>
</dialog>
<dialog id="impd">
  <b>Import proxy list</b>
  <div class="small">Reads the proxy list (.txt, one ip:port:user:pass per line) from the fleet folder on Windows.
    Line 1 goes to the first slot, line 2 to the next...</div>
  <label>Slots <input id="imps" value="1-5"></label>
  <label><input type="checkbox" id="impf" checked style="width:auto"> First remove these slots' old logins + game id (fresh accounts)</label>
  <div class="btns"><button class="primary" id="impgo">Import</button><button id="impclose">Close</button></div>
  <pre id="impout"></pre>
</dialog>
<script type="module">
import RFB from '/novnc/core/rfb.js';

const $ = (id) => document.getElementById(id);
const fmt = (s) => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}h ${String(m).padStart(2, '0')}m` : m ? `${m}m ${String(x).padStart(2, '0')}s` : `${x}s`; };
const gb = (b) => (b / 1073741824).toFixed(1);
const ACTIVE = ['waiting', 'starting', 'running'];
// colour group of an activity (same groups as the Telegram screens picture)
const KIND = (a) => { a = (a || '').toLowerCase();
  if (['dead', 'error'].includes(a)) return 'bad';
  if (['short pause', 'long pause', 'alt tab', 'paused', 'resting'].includes(a)) return 'pause';
  if (['roaming', 'walking', 'walking to bank', 'walking to trees', 'banking', 'searching', 'looking for a target',
       'waiting for trees', 'free roam', 'dropping'].includes(a)) return 'move';
  if (['done', 'stopped', 'waiting', 'starting', 'logging in', 'restarting', ''].includes(a)) return 'idle';
  return 'good'; };
const chip = (a) => { const c = document.createElement('span'); c.className = 'act k-' + KIND(a); c.textContent = a || '–'; return c; };
const COUNT = { burned: 'burned', logs: 'logs', banked: 'banked', dropped: 'dropped', kills: 'kills', loot: 'loot', buried: 'buried', used: 'used' };
function countsText(r) {
  const c = r.counts || {}; const began = r.began_at || r.start_at; const secs = r.ran_s || (Date.now() / 1000 - began);
  const h = secs / 3600;
  return Object.entries(c).filter(([k, v]) => v).map(([k, v]) => `${v} ${COUNT[k] || k}` + (h >= 0.05 ? ` (${Math.round(v / h)}/h)` : '')).join(' · ');
}
const SCREEN_W = 1280, SCREEN_H = 800;
let runs = {}, names = {}, geom = {}, tiles = {}, shown = [];
const browsing = new Set();   // slots with a browser open: show their whole screen

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}

// ------------------------------------------------------------- controls
async function loadAccounts() {
  const [s, b] = await Promise.all([api('/api/slots'), api('/api/bots')]);
  const box = $('accts'); const checked = new Set([...box.querySelectorAll('input:checked')].map(i => i.value));
  box.innerHTML = '';
  for (const sl of s.slots) {
    names[sl.slot] = sl.account || '';
    const name = sl.account; const busy = runs[sl.slot] && ACTIVE.includes(runs[sl.slot].status);
    const el = document.createElement('label'); el.className = 'acct' + (name && !busy ? '' : ' off');
    el.innerHTML = `<input type="checkbox" value="${sl.slot}" ${name && !busy ? '' : 'disabled'} ${checked.has(String(sl.slot)) && !busy ? 'checked' : ''}>
      <span class="sl">${sl.slot}</span><span class="nm"></span>`;
    el.querySelector('.nm').textContent = name || 'no login';
    el.querySelector('input').addEventListener('change', () => { accLabel(); preselect(); });
    if (busy) el.title = 'already launched';
    if (!name) {   // new account: copy the login that the Jagex Launcher last saved on Windows
      const b = document.createElement('button'); b.className = 'cl'; b.textContent = 'copy login';
      b.title = 'First log this account in once via the Jagex Launcher on Windows (RuneLite), close it, then click';
      b.onclick = async (e) => { e.preventDefault(); b.disabled = true; b.textContent = 'copying…';
        try { const r = await api(`/api/slot/${sl.slot}/creds`, {}); b.textContent = r.ok ? 'copied - wait ~1 min' : 'failed';
              if (!r.ok) $('err').textContent = r.error || 'copy failed'; }
        catch (err) { b.textContent = 'failed'; $('err').textContent = err.message; } };
      el.appendChild(b);
    }
    const pb = document.createElement('button'); pb.className = 'px' + (sl.proxy ? ' on' : '');
    pb.textContent = sl.proxy ? 'proxy ✓' : 'proxy'; pb.title = sl.proxy ? 'This slot uses its own proxy' : 'This slot uses the home IP';
    pb.onclick = (e) => { e.preventDefault(); openProxy(sl.slot); };
    el.appendChild(pb);
    box.appendChild(el);
  }
  const sel = $('bot'); if (!sel.options.length) {
    const fr = document.createElement('option'); fr.value = 'freeroam'; fr.textContent = 'Free roam (log in only)'; sel.appendChild(fr);
    for (const x of b.bots) { const o = document.createElement('option'); o.value = x.id; o.textContent = x.name; sel.appendChild(o); }
    sel.value = localStorage.getItem('osrs-bot') || 'woodcutter';
  }
  accLabel();
  for (const n of shown) setLabel(n);
}
// choosing accounts: preselect the bot and run time they ran last (their settings are
// saved per account and bot, so ⚙ Settings then shows exactly those)
let lastRun = {};
function preselect() {
  const sel = [...document.querySelectorAll('#accts input:checked')].map(i => i.value);
  const prev = sel.map(n => lastRun[n]).filter(Boolean);
  if (!prev.length || prev.some(p => p.bot !== prev[0].bot)) return;   // nothing known / mixed
  const b = $('bot'); if (![...b.options].some(o => o.value === prev[0].bot)) return;
  b.value = prev[0].bot;
  if (sel.length === 1 && prev[0].minutes) {
    $('hours').value = Math.floor(prev[0].minutes / 60); $('mins').value = Math.round(prev[0].minutes % 60);
  }
}
function accLabel() {
  const sel = [...document.querySelectorAll('#accts input:checked')];
  $('accBtn').textContent = sel.length ? `Accounts: ${sel.length === 1 ? (names[sel[0].value] || 'slot ' + sel[0].value) : sel.length + ' chosen'} ▾` : 'Accounts ▾';
}
function setLabel(n) {
  const t = tiles[n]; if (!t) return;
  const r = runs[n]; t.lbl.innerHTML = '';
  const nm = document.createElement('span'); nm.className = 'nm2'; nm.textContent = `${n} · ${names[n] || ''}`;
  t.lbl.append(nm, chip(r ? r.activity : ''));
  const ct = r ? countsText(r) : ''; t.lbl.title = ct;
}

// ------------------------------------------------------------- per-slot proxy
let pxSlot = 0;
async function openProxy(n) {
  pxSlot = n; $('pxt').textContent = `Proxy - slot ${n}`; $('pxout').textContent = ''; $('pxw').value = '';
  $('pxd').showModal();
  try { const r = await api(`/api/slot/${n}/proxy`);
    if (r.on) { $('pxnow').textContent = `On: ${r.host}:${r.port}` + (r.running === false ? ' (proxy not running!)' : '');
      $('pxh').value = r.host || ''; $('pxp').value = r.port || ''; $('pxl').value = r.login || '';
      $('pxs').value = r.type === 'http-connect' ? 'http' : 'socks5'; }
    else { $('pxnow').textContent = 'Off - this slot uses the home IP.'; if (!$('pxp').value) $('pxp').value = 10000 + n; }
  } catch (e) { $('pxnow').textContent = e.message; }
}
$('pxclose').onclick = () => { $('pxd').close(); refresh(); };
$('pxsave').onclick = async () => {
  const h = $('pxh').value.trim(), p = $('pxp').value.trim(), l = $('pxl').value.trim(), w = $('pxw').value;
  if (!h || !p) { $('pxout').textContent = 'Host and port are needed.'; return; }
  if (l && !w) { $('pxout').textContent = 'Type the password too.'; return; }
  const auth = l ? `${encodeURIComponent(l)}:${encodeURIComponent(w)}@` : '';
  $('pxout').textContent = 'Saving (the first time it installs a small program, ~1 min)…';
  try { const r = await api(`/api/slot/${pxSlot}/proxy`, { url: `${$('pxs').value}://${auth}${h}:${p}` });
    $('pxw').value = '';
    $('pxout').textContent = r.ok ? 'Saved. RuneLite is restarting. Press "Test IP" to check.' : ('Failed: ' + (r.error || JSON.stringify(r.errors)));
  } catch (e) { $('pxout').textContent = 'Failed: ' + e.message; }
};
$('pxoff').onclick = async () => {
  if (!confirm(`Slot ${pxSlot} will use the HOME IP again. Continue?`)) return;
  try { const r = await api(`/api/slot/${pxSlot}/proxy`, { off: true }); $('pxout').textContent = r.ok ? 'Off - home IP. RuneLite is restarting.' : ('Failed: ' + r.error); }
  catch (e) { $('pxout').textContent = 'Failed: ' + e.message; }
};
const slotAct = async (action, okMsg) => {
  try { const r = await api(`/api/slot/${pxSlot}/${action}`, {}); $('pxout').textContent = r.ok ? okMsg : ('Failed: ' + (r.error || '?')); return r.ok; }
  catch (e) { $('pxout').textContent = 'Failed: ' + e.message; return false; }
};
$('pxforget').onclick = async () => {
  if (!confirm(`Remove slot ${pxSlot}'s login? You'll need "copy login" again for a new account.`)) return;
  await slotAct('forget', 'Login removed. RuneLite restarted without a login.');
};
$('pxbrowser').onclick = async () => {
  $('pxout').textContent = 'Opening (the first time it installs Firefox, 1-3 min)…';
  if (await slotAct('browser', 'Browser is open on this slot\'s screen (shown below). Make the account there.')) {
    browsing.add(pxSlot); syncScreens(); }
};
$('pxbclose').onclick = async () => { await slotAct('browser-close', 'Browser closed.'); browsing.delete(pxSlot); syncScreens(); };
$('impopen').onclick = () => { $('impout').textContent = ''; $('impd').showModal(); };
$('impclose').onclick = () => { $('impd').close(); refresh(); };
$('impgo').onclick = async () => {
  const forget = $('impf').checked, slots = $('imps').value.trim();
  if (forget && !confirm(`Slots ${slots}: the old logins will be removed and each slot gets its own proxy. Continue?`)) return;
  $('impgo').disabled = true; $('impout').textContent = 'Starting…';
  try {
    const r = await api('/api/fleet/proxy-import', { slots, forget });
    if (!r.ok) throw new Error(r.error || 'failed');
    for (let i = 0; i < 150; i++) {            // follow the log (up to ~5 min)
      await new Promise(res => setTimeout(res, 2000));
      const t = await (await fetch(`/api/update-log/${r.unit}`)).text();
      const lines = t.split('\n').map(l => l.replace(/^\S+ \S+ \S+: /, '')).filter(l => l && !l.startsWith('--'));
      $('impout').textContent = lines.slice(-25).join('\n');
      if (/Finished|Deactivated|"ok": (true|false)/.test(t) && /"slots"/.test(t)) break;
    }
  } catch (e) { $('impout').textContent += '\nFailed: ' + e.message; }
  $('impgo').disabled = false;
};
$('pxtest').onclick = async () => {
  $('pxout').textContent = 'Checking…';
  try { const r = await api(`/api/slot/${pxSlot}/proxy-test`, {});
    const f = (x) => x.ip ? `${x.ip}  ${x.country} ${x.city}  ${x.org}` : (x.error || '?');
    $('pxout').textContent = `Slot ${pxSlot}: ${f(r.slot_ip)}\nHome:   ${f(r.home_ip)}\n` +
      (r.ok ? (r.proxy_on ? 'OK - the slot has a different IP.' : 'Proxy is off - same as home.') : 'PROBLEM - no connection or same IP as home.');
  } catch (e) { $('pxout').textContent = 'Failed: ' + e.message; }
};

async function loadRuns() {
  const st = await api('/api/launch'); runs = st.runs; lastRun = st.last || {}; const box = $('runs'); box.innerHTML = '';
  const keys = Object.keys(runs);
  if (!keys.length) box.innerHTML = '<span class="small">Nothing launched.</span>';
  for (const k of keys) {
    const r = runs[k]; const el = document.createElement('div'); el.className = 'run';
    const when = r.status === 'waiting' ? 'starts in ' + fmt(r.starts_in)
      : ACTIVE.includes(r.status) ? fmt(r.stops_in) + ' left' : '';
    el.innerHTML = `<b>${r.slot}</b><span class="a"></span><span>${r.bot === 'freeroam' ? 'free roam' : r.bot}</span>
      <span class="ch"></span><span class="small">${when}</span><span class="m"></span>
      ${ACTIVE.includes(r.status) ? '<button class="stop">Stop</button>' : ''}`;
    el.querySelector('.a').textContent = r.account || '';
    el.querySelector('.ch').append(chip(r.activity || r.status));
    const ct = countsText(r);
    el.querySelector('.m').textContent = ct || r.msg || ''; el.querySelector('.m').title = (r.msg || '') + (ct ? '\n' + ct : '');
    const b = el.querySelector('.stop'); if (b) b.onclick = () => api('/api/launch/stop', { slots: [r.slot] }).then(refresh);
    box.appendChild(el);
  }
  const n = (st) => keys.filter(k => runs[k].status === st).length;
  const parts = [];
  if (n('running')) parts.push(`${n('running')} running`);
  if (n('waiting') + n('starting')) parts.push(`${n('waiting') + n('starting')} starting`);
  if (n('dead')) parts.push(`${n('dead')} dead`);
  if (n('error')) parts.push(`${n('error')} failed`);
  if (n('done') + n('stopped')) parts.push(`${n('done') + n('stopped')} finished`);
  $('runBtn').textContent = `Bots: ${parts.join(' · ') || 'none'} ▾`;
  syncScreens();
  for (const k of shown) setLabel(k);
}

async function loadStats() {
  try {
    const s = await api('/api/stats?min=5'); const v = s.vm;
    let t = `RAM ${gb(v.ram_used)}/${gb(v.ram_total)} GB · CPU ${Math.round(v.cpu_avg ?? 0)}%`;
    if (v.swap_used > 104857600) t += ` · swap ${gb(v.swap_used)} GB`;
    $('res').textContent = t;
  } catch (e) { $('res').textContent = ''; }
}

async function refresh() { try { await loadRuns(); await loadAccounts(); $('err').textContent = ''; } catch (e) { $('err').textContent = e.message; } }

$('go').onclick = async () => {
  $('err').textContent = '';
  const slots = [...document.querySelectorAll('#accts input:checked')].map(i => +i.value);
  const minutes = (+$('hours').value || 0) * 60 + (+$('mins').value || 0);
  const bot = $('bot').value;
  localStorage.setItem('osrs-bot', bot === 'freeroam' ? (localStorage.getItem('osrs-bot') || 'woodcutter') : bot);
  try { await api('/api/launch', { slots, bot, minutes, spread: $('spread').checked });
        document.querySelectorAll('#accts input').forEach(i => i.checked = false); await refresh(); }
  catch (e) { $('err').textContent = e.message; }
};
$('all').onclick = () => { document.querySelectorAll('#accts input:not(:disabled)').forEach(i => i.checked = true); accLabel(); };
$('stopall').onclick = () => { if (confirm('Stop all launched bots?')) api('/api/launch/stop', { slots: [] }).then(refresh); };
$('clear').onclick = () => api('/api/launch/clear', {}).then(refresh);

// dropdown panels: open one at a time, close on a click elsewhere
for (const id of ['ddAcc', 'ddRun']) {
  const dd = $(id);
  dd.querySelector('.ddb').onclick = (e) => { e.stopPropagation(); const open = !dd.classList.contains('open');
    document.querySelectorAll('.dd.open').forEach(x => x.classList.remove('open')); dd.classList.toggle('open', open); };
  dd.querySelector('.ddp').addEventListener('click', (e) => e.stopPropagation());
}
document.addEventListener('click', () => document.querySelectorAll('.dd.open').forEach(x => x.classList.remove('open')));
$('none').onclick = () => { document.querySelectorAll('#accts input').forEach(i => i.checked = false); accLabel(); };

// ------------------------------------------------------------- bot settings
// A few settings per bot, saved into each chosen account's slot (or every slot with a login).
const PCT = (k, label) => ({ k, label, kind: 'pct' });
const HABITS = [PCT('alt_tab_chance', 'Alt-tab chance (per minute)'), PCT('walk_away_chance', 'Walk-away chance'),
  PCT('skip_hover_chance', 'Quick clicks (no mouse-over check)'), PCT('quick_loot_chance', 'Quick loot clicks (miss more)'),
  PCT('quick_use_chance', 'Quick bury/eat clicks'), PCT('quick_drop_chance', 'Quick drop clicks'),
  PCT('double_click_chance', 'Quick clicks that are double clicks'), PCT('misclick_chance', 'Misclick chance')];
const TREES = { 'Tree': ['Chop down Tree', 'Logs'], 'Oak': ['Chop down Oak', 'Oak logs'], 'Willow': ['Chop down Willow', 'Willow logs'] };
const FORMS = {
  woodcutter: [
    { k: 'drop_items', label: 'Logs when the inventory is full', kind: 'select', opts: [['true', 'Drop them'], ['false', 'Bank them']],
      note: 'Banking walks the saved bank route (default: Draynor willows ↔ Draynor bank).' },
    { k: 'tree', label: 'Trees to cut', kind: 'tree' },
    { k: 'burn_logs', label: 'Firemaking: light the logs right away (tinderbox)', kind: 'bool' },
    { k: 'home_max_tiles', label: 'Walk back to the trees when more than N tiles away', kind: 'int' },
    { k: 'max_trees_before_forced_break', label: 'Short break after N trees without one (0 = off)', kind: 'int' },
  ],
  slayer: [
    { k: 'targets', label: 'Monsters to attack', kind: 'list', ph: 'Cow, Chicken' },
    { k: 'loot', label: 'Pick up loot', kind: 'bool' },
    { k: 'loot_use', label: 'Loot to use at once (bury / eat)', kind: 'lootlist', ph: 'Bones' },
    { k: 'loot_keep', label: 'Loot to keep (for banking)', kind: 'lootlist', ph: 'Cowhide' },
    { k: 'junk_items', label: 'Always drop these', kind: 'list', ph: 'Cowhide, Raw beef' },
    { k: 'min_hp', label: 'Rest below HP %', kind: 'int' },
    { k: 'resume_hp', label: 'Fight again at HP %', kind: 'int' },
    { k: 'max_kills_before_forced_break', label: 'Short break after N kills without one', kind: 'int' },
    { k: 'return_home', label: 'Walk back to the start area when it wandered off', kind: 'bool' },
    { k: 'home_max_tiles', label: 'Walk back after a kill when more than N tiles away', kind: 'int' },
  ],
};
let cfgSlots = [], cfgBot = '', cfgLoaded = null;
function cfgTargets() {
  // only the chosen accounts: saving for "all" overwrote other accounts' settings
  return [...document.querySelectorAll('#accts input:checked')].map(i => +i.value);
}
$('cfgopen').onclick = async () => {
  cfgBot = $('bot').value; $('cfgout').textContent = ''; $('cfgbody').innerHTML = '';
  if (cfgBot === 'freeroam') { $('err').textContent = 'Free roam has no settings.'; return; }
  cfgSlots = cfgTargets();
  if (!cfgSlots.length) { $('err').textContent = 'Choose the account(s) first (Accounts ▾): settings are kept per account.'; return; }
  $('cfgt').textContent = `${$('bot').selectedOptions[0].textContent} – settings`;
  $('cfgfor').textContent = `For: ${cfgSlots.map(n => `${n} ${names[n] || ''}`).join(', ')}`;
  $('cfgd').showModal();
  try { cfgLoaded = await api(`/api/slot/${cfgSlots[0]}/botcfg/${cfgBot}`); }
  catch (e) { $('cfgout').textContent = 'Couldn\'t read the settings: ' + e.message; return; }
  const fields = [...(FORMS[cfgBot] || []), ...HABITS.filter(f => f.k in cfgLoaded)];
  const body = $('cfgbody');
  const v = (k) => (cfgLoaded[k] || {}).value;
  for (const f of fields) {
    if (f.k === 'alt_tab_chance') { const h = document.createElement('h3'); h.textContent = 'Habits'; body.appendChild(h); }
    if (f.kind !== 'tree' && !(f.k in cfgLoaded)) continue;
    const l = document.createElement('label'); l.textContent = f.label; let inp;
    if (f.kind === 'select') { inp = document.createElement('select');
      for (const [val, t] of f.opts) { const o = document.createElement('option'); o.value = val; o.textContent = t; inp.appendChild(o); }
      inp.value = String(v(f.k)); }
    else if (f.kind === 'tree') { inp = document.createElement('select');
      for (const t of Object.keys(TREES)) { const o = document.createElement('option'); o.value = t; o.textContent = t; inp.appendChild(o); }
      const hv = v('tree_hover') || ''; inp.value = Object.keys(TREES).find(t => TREES[t][0] === hv) || 'Tree'; }
    else if (f.kind === 'bool') { inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = !!v(f.k); }
    else if (f.kind === 'list') { inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = f.ph || '';
      inp.value = (v(f.k) || []).join(', '); }
    else if (f.kind === 'lootlist') {   // "Nothing" or a list of item names
      const box = document.createElement('span'); box.style.cssText = 'display:flex;gap:6px;flex:1;min-width:0';
      const sel = document.createElement('select');
      for (const [val, t] of [['none', 'Nothing'], ['items', 'These items:']]) { const o = document.createElement('option'); o.value = val; o.textContent = t; sel.appendChild(o); }
      const txt = document.createElement('input'); txt.type = 'text'; txt.placeholder = f.ph || '';
      const cur = v(f.k) || []; txt.value = cur.join(', '); sel.value = cur.length ? 'items' : 'none';
      const sync = () => { txt.style.display = sel.value === 'items' ? '' : 'none'; }; sel.onchange = sync; sync();
      box.append(sel, txt); inp = box; inp.dataset.k = f.k; inp.dataset.kind = f.kind; }
    else if (f.kind === 'int') { inp = document.createElement('input'); inp.type = 'number'; inp.value = v(f.k); }
    else if (f.kind === 'text') { inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = f.ph || '';
      inp.value = v(f.k) || ''; }
    else { inp = document.createElement('input'); inp.type = 'number'; inp.step = '0.1'; inp.min = 0; inp.max = 100;
      inp.value = +(100 * (v(f.k) || 0)).toFixed(2); l.title = 'in %'; }
    inp.dataset.k = f.k; inp.dataset.kind = f.kind; l.appendChild(inp); body.appendChild(l);
    if (f.note) { const d = document.createElement('div'); d.className = 'small'; d.textContent = f.note; body.appendChild(d); }
  }
};
$('cfgclose').onclick = () => $('cfgd').close();
$('cfgsave').onclick = async () => {
  const out = {};
  for (const inp of $('cfgbody').querySelectorAll('[data-k]')) {
    const k = inp.dataset.k, kind = inp.dataset.kind;
    if (kind === 'select') out[k] = inp.value === 'true';
    else if (kind === 'tree') { out.tree_hover = TREES[inp.value][0]; out.log_type = { name: TREES[inp.value][1] }; }
    else if (kind === 'bool') out[k] = inp.checked;
    else if (kind === 'list') out[k] = inp.value.split(',').map(x => x.trim()).filter(Boolean);
    else if (kind === 'lootlist') { const [sel, txt] = inp.children;
      out[k] = sel.value === 'none' ? [] : txt.value.split(',').map(x => x.trim()).filter(Boolean); }
    else if (kind === 'int') out[k] = Math.round(+inp.value || 0);
    else if (kind === 'text') out[k] = inp.value.trim();
    else out[k] = Math.max(0, Math.min(1, (+inp.value || 0) / 100));
  }
  const lines = [];
  for (const n of cfgSlots) {
    try { const r = await api(`/api/slot/${n}/botcfg/${cfgBot}`, out); lines.push(`${n} ${names[n] || ''}: ${r.ok ? 'saved' : 'failed'}`); }
    catch (e) { lines.push(`${n} ${names[n] || ''}: ${e.message}`); }
  }
  $('cfgout').textContent = lines.join('\n') + '\n(used from the next launch)';
};

// ------------------------------------------------------------- screens
// Shown: every slot that is launched (waiting, starting or running).
function wanted() {
  const w = new Set([...Object.values(runs).filter(r => ACTIVE.includes(r.status)).map(r => r.slot), ...browsing]);
  return [...w].sort((a, b) => a - b);
}

function syncScreens() {
  const want = wanted();
  if (want.join() === shown.join()) return;
  for (const n of shown) if (!want.includes(n)) {             // no longer launched: close
    const t = tiles[n]; t.closing = true; try { t.rfb?.disconnect(); } catch (e) {} t.el.remove(); delete tiles[n];
  }
  for (const n of want) if (!tiles[n]) {                      // newly launched: open
    const el = document.createElement('div'); el.className = 'tile';
    const inner = document.createElement('div'); inner.className = 'inner';
    const lbl = document.createElement('div'); lbl.className = 'lbl';
    const msg = document.createElement('div'); msg.className = 'msg'; msg.textContent = 'connecting…';
    el.append(inner, msg, lbl);
    el.addEventListener('mouseenter', () => el.classList.add('focus'));
    el.addEventListener('mouseleave', () => { el.classList.remove('focus'); tiles[n]?.rfb?.blur(); });
    tiles[n] = { el, inner, msg, lbl, rfb: null };
    connect(n);
  }
  shown = want;
  const grid = $('grid');
  for (const n of shown) grid.appendChild(tiles[n].el);      // keep slot order
  $('empty').style.display = shown.length ? 'none' : '';
  layout();
}

function crop(n) {  // RuneLite window rect on the slot's screen (fallback: whole screen)
  const g = browsing.has(n) ? null : geom[n]; return g ? g : { x: 0, y: 0, width: SCREEN_W, height: SCREEN_H };
}

function layout() {
  if (!shown.length) return;
  const grid = $('grid'); const W = grid.clientWidth, H = grid.clientHeight;
  const cw = Math.max(...shown.map(n => crop(n).width)), ch = Math.max(...shown.map(n => crop(n).height));
  let best = { s: 0, cols: 1 };
  for (let cols = 1; cols <= shown.length; cols++) {
    const rows = Math.ceil(shown.length / cols);
    const s = Math.min((W - 2 * (cols - 1)) / (cols * cw), (H - 2 * (rows - 1)) / (rows * ch));
    if (s > best.s) best = { s, cols };
  }
  const s = best.s;
  grid.style.gridTemplateColumns = `repeat(${best.cols}, ${Math.floor(cw * s)}px)`;
  for (const n of shown) {
    const t = tiles[n], c = crop(n);
    t.el.style.width = Math.floor(cw * s) + 'px'; t.el.style.height = Math.floor(ch * s) + 'px';
    // the whole screen, scaled by s, shifted so the RuneLite window is at the tile's corner
    t.inner.style.width = SCREEN_W * s + 'px'; t.inner.style.height = SCREEN_H * s + 'px';
    t.inner.style.left = -c.x * s + 'px'; t.inner.style.top = -c.y * s + 'px';
  }
  requestAnimationFrame(rescale);
}

// noVNC only rescales its picture when its box size differs from the size it had at
// connect time: a box that shrank (a new account's screen joined) and then grew back
// to that size kept the small picture - the "messed up window size" until a reload.
// So rescale every screen ourselves after each layout (and every few seconds).
function rescale() {
  for (const n of shown) {
    const t = tiles[n]; if (!t?.rfb) continue;
    try { t.rfb.scaleViewport = true; } catch (e) {}
  }
}

function connect(n) {
  const t = tiles[n]; if (!t || t.closing) return;
  if (t.rfb) { try { t.rfb.disconnect(); } catch (e) {} }
  t.inner.innerHTML = '';
  const rfb = new RFB(t.inner, `ws://${location.host}/ws/slot${n}`, { shared: true });
  rfb.scaleViewport = true; rfb.resizeSession = false; rfb.focusOnClick = true;
  rfb.addEventListener('disconnect', () => { if (t.closing || tiles[n] !== t) return;
    t.msg.textContent = 'reconnecting…'; t.msg.style.display = ''; setTimeout(() => connect(n), 3000); });
  rfb.addEventListener('connect', () => { t.msg.style.display = 'none'; requestAnimationFrame(rescale); });
  t.rfb = rfb;
}

new ResizeObserver(layout).observe($('grid'));
// RuneLite windows move when their side panel opens: follow them.
async function loadGeom() { try { const g = await api('/api/geometry');
  if (JSON.stringify(g) !== JSON.stringify(geom)) { geom = g; layout(); } } catch (e) {} }

await loadGeom();
refresh(); loadStats();
setInterval(() => loadRuns().catch(() => {}), 1000);
setInterval(() => loadAccounts().catch(() => {}), 10000);
setInterval(loadGeom, 5000);
setInterval(rescale, 3000);
setInterval(loadStats, 10000);
</script>
