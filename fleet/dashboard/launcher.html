<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSRS Launcher</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1d1b18; --muted: #6f6a62; --line: #e2ddd5;
    --ok: #2f7d4f; --warn: #b7791f; --bad: #b4382f; --idle: #8a8478; --accent: #7a5c2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141311; --panel: #1e1c19; --ink: #ece8e1; --muted: #9b958b; --line: #2e2b27;
      --ok: #5cbf83; --warn: #e0a84a; --bad: #e46a5f; --idle: #8a8478; --accent: #d1a866;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; padding: 18px 20px 4px; }
  h1 { font-size: 20px; margin: 0; }
  header a { color: var(--muted); font-size: 13px; }
  main { display: grid; gap: 16px; padding: 12px 20px 28px; max-width: 980px;
         grid-template-columns: minmax(0, 1fr); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .accts { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .acct { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--line);
          border-radius: 8px; cursor: pointer; min-width: 0; }
  .acct input { accent-color: var(--accent); }
  .acct .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct .sl { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .acct.off { opacity: .45; cursor: not-allowed; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 12px; }
  label.f { display: flex; align-items: center; gap: 8px; }
  select, input[type=number] { font: inherit; padding: 5px 8px; border-radius: 6px;
         border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  input[type=number] { width: 80px; }
  button { font: inherit; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line);
           background: transparent; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
  button:hover { border-color: var(--accent); }
  .small { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .st { font-weight: 600; }
  .st-running { color: var(--ok); } .st-waiting, .st-starting { color: var(--warn); }
  .st-error { color: var(--bad); } .st-done, .st-stopped { color: var(--idle); }
  .err { color: var(--bad); margin-top: 8px; min-height: 1.2em; }
  .empty { color: var(--muted); }
  @media (max-width: 600px) { main, header { padding-left: 12px; padding-right: 12px; } }
</style>
</head>
<body>
<header>
  <h1>OSRS Launcher</h1>
  <a href="/">Dashboard</a>
  <a href="/view" id="viewlink">Screens</a>
</header>
<main>
  <section>
    <h2>Accounts</h2>
    <div class="accts" id="accts"><span class="small">Loading accounts…</span></div>
    <div class="row">
      <label class="f">Bot <select id="bot"></select></label>
      <label class="f">Run for <input type="number" id="hours" min="0" max="24" step="1" value="1"> h
        <input type="number" id="mins" min="0" max="59" step="5" value="0"> min</label>
      <label class="f"><input type="checkbox" id="spread" checked> Spread out</label>
    </div>
    <div class="row">
      <button class="primary" id="go">Launch</button>
      <button id="all">Select all</button>
      <span class="small">Spread out: each account starts 1–4 min after the previous one, run times vary ±10%.
        Each account must already be standing where its bot works.</span>
    </div>
    <div class="err" id="err"></div>
  </section>
  <section>
    <div class="row" style="margin-top:0;justify-content:space-between">
      <h2 style="margin:0">Running</h2>
      <span>
        <button id="openview">Open screens</button>
        <button id="clear">Clear finished</button>
        <button id="stopall">Stop all</button>
      </span>
    </div>
    <table>
      <thead><tr><th>Slot</th><th>Account</th><th>Bot</th><th>Status</th><th>Starts / stops in</th><th></th></tr></thead>
      <tbody id="runs"></tbody>
    </table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (s) => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + 'h ' : '') + (h || m ? m + 'm ' : '') + x + 's'; };
let runs = {};

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}

async function loadAccounts() {
  const [s, b] = await Promise.all([api('/api/slots'), api('/api/bots')]);
  const box = $('accts'); const checked = new Set([...box.querySelectorAll('input:checked')].map(i => i.value));
  box.innerHTML = '';
  for (const sl of s.slots) {
    const name = sl.account; const busy = runs[sl.slot] && ['waiting', 'starting', 'running'].includes(runs[sl.slot].status);
    const el = document.createElement('label'); el.className = 'acct' + (name && !busy ? '' : ' off');
    el.innerHTML = `<input type="checkbox" value="${sl.slot}" ${name && !busy ? '' : 'disabled'} ${checked.has(String(sl.slot)) ? 'checked' : ''}>
      <span class="nm"></span><span class="sl">slot ${sl.slot}</span>`;
    el.querySelector('.nm').textContent = name || (busy ? 'launched' : 'no login');
    box.appendChild(el);
  }
  const sel = $('bot'); if (!sel.options.length) {
    for (const x of b.bots) { const o = document.createElement('option'); o.value = x.id; o.textContent = x.name; sel.appendChild(o); }
    sel.value = localStorage.getItem('osrs-bot') || 'woodcutter';
  }
}

async function loadRuns() {
  const st = await api('/api/launch'); runs = st.runs; const tb = $('runs'); tb.innerHTML = '';
  const keys = Object.keys(runs);
  if (!keys.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">Nothing launched.</td></tr>'; return; }
  for (const k of keys) {
    const r = runs[k]; const tr = document.createElement('tr');
    const when = r.status === 'waiting' ? 'starts in ' + fmt(r.starts_in)
      : ['starting', 'running'].includes(r.status) ? 'stops in ' + fmt(r.stops_in) : '';
    tr.innerHTML = `<td>${r.slot}</td><td class="a"></td><td>${r.bot}</td>
      <td><span class="st st-${r.status}">${r.status}</span><div class="small m"></div></td><td>${when}</td>
      <td>${['waiting', 'starting', 'running'].includes(r.status) ? '<button class="stop">Stop</button>' : ''}</td>`;
    tr.querySelector('.a').textContent = r.account || '';
    tr.querySelector('.m').textContent = r.msg || '';
    const b = tr.querySelector('.stop'); if (b) b.onclick = () => api('/api/launch/stop', { slots: [r.slot] }).then(refresh);
    tb.appendChild(tr);
  }
}

function runningSlots() { return Object.values(runs).filter(r => ['starting', 'running', 'waiting'].includes(r.status)).map(r => r.slot); }

async function refresh() { try { await loadRuns(); await loadAccounts(); } catch (e) { $('err').textContent = e.message; } }

$('go').onclick = async () => {
  $('err').textContent = '';
  const slots = [...document.querySelectorAll('#accts input:checked')].map(i => +i.value);
  const minutes = (+$('hours').value || 0) * 60 + (+$('mins').value || 0);
  localStorage.setItem('osrs-bot', $('bot').value);
  try { await api('/api/launch', { slots, bot: $('bot').value, minutes, spread: $('spread').checked });
        document.querySelectorAll('#accts input').forEach(i => i.checked = false); await refresh(); }
  catch (e) { $('err').textContent = e.message; }
};
$('all').onclick = () => document.querySelectorAll('#accts input:not(:disabled)').forEach(i => i.checked = true);
$('stopall').onclick = () => api('/api/launch/stop', { slots: [] }).then(refresh);
$('clear').onclick = () => api('/api/launch/clear', {}).then(refresh);
$('openview').onclick = () => { const s = runningSlots(); window.open('/view' + (s.length ? '?slots=' + s.join(',') : ''), 'osrs-view'); };
refresh(); setInterval(loadRuns, 1000); setInterval(loadAccounts, 10000);
</script>
</body>
</html>
