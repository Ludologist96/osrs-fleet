<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSRS Fleet</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1d1b18; --muted: #6f6a62; --line: #e2ddd5;
    --ok: #2f7d4f; --warn: #b7791f; --bad: #b4382f; --idle: #8a8478; --accent: #7a5c2e;
    --shot-bg: #1b1a18;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141311; --panel: #1e1c19; --ink: #ece8e1; --muted: #9b958b; --line: #2e2b27;
      --ok: #5cbf83; --warn: #e0a84a; --bad: #e46a5f; --idle: #8a8478; --accent: #d1a866;
      --shot-bg: #0c0b0a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px;
           padding: 18px 20px 6px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  .totals { display: flex; gap: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .totals b { color: var(--ink); }
  .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { display: grid; gap: 14px; padding: 12px 20px 28px;
         grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          overflow: hidden; display: flex; flex-direction: column; }
  .shot { position: relative; aspect-ratio: 16 / 10; background: var(--shot-bg); cursor: zoom-in; }
  .shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .shot .none { position: absolute; inset: 0; display: grid; place-items: center;
                color: #8a8478; font-size: 13px; }
  .body { padding: 10px 12px 12px; display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .slot { font-weight: 700; }
  .acct { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { margin-left: auto; padding: 2px 9px; border-radius: 999px; font-size: 12px;
          font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
  .s-running { color: var(--ok); } .s-paused { color: var(--warn); }
  .s-idle { color: var(--idle); } .s-offline { color: var(--bad); }
  .bot { font-variant-numeric: tabular-nums; }
  .bot .rt { color: var(--muted); }
  .units { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         margin-right: 4px; background: var(--bad); }
  .dot.on { background: var(--ok); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button, a.btn { font: inherit; font-size: 12px; padding: 5px 9px; border-radius: 6px;
                  border: 1px solid var(--line); background: transparent; color: var(--ink);
                  cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover { border-color: var(--accent); }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .vnc { font-size: 12px; color: var(--muted); }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  dialog { border: 0; padding: 0; background: var(--shot-bg); border-radius: 10px;
           max-width: 96vw; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  dialog img { display: block; max-width: 96vw; max-height: 90vh; }
  dialog .cap { color: #ddd; padding: 6px 10px; font-size: 13px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
           background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px;
           opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>OSRS Fleet</h1>
  <div class="totals" id="totals"></div>
  <div class="hint"><a class="btn primary" href="/launcher">Launcher + screens</a> · click a screen to enlarge</div>
</header>
<main id="grid"></main>

<dialog id="big"><img id="bigimg" alt=""><div class="cap" id="bigcap"></div></dialog>
<div class="toast" id="toast"></div>

<script>
const grid = document.getElementById('grid');
const cards = new Map();
let bigSlot = null;

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

async function act(n, action, label) {
  try {
    const r = await fetch(`/api/slot/${n}/${action}`, { method: 'POST' });
    const j = await r.json();
    toast(j.ok ? `Slot ${n}: ${label}` : `Slot ${n}: ${label} failed ${j.error || ''}`);
  } catch { toast(`Slot ${n}: request failed`); }
  setTimeout(refresh, 1500);
}

function makeCard(n) {
  const c = el('div', 'card');
  const shot = el('div', 'shot');
  const img = el('img'); img.alt = `Slot ${n} screen`;
  const none = el('div', 'none', 'no screen');
  img.onload = () => { none.style.display = 'none'; };
  img.onerror = () => { none.style.display = 'grid'; };
  shot.append(img, none);
  shot.onclick = () => { bigSlot = n; document.getElementById('bigimg').src = `/shot/${n}.jpg?w=1280&t=${Date.now()}`; document.getElementById('big').showModal(); };

  const body = el('div', 'body');
  const r1 = el('div', 'row');
  const slot = el('span', 'slot', `Slot ${n}`);
  const acct = el('span', 'acct');
  const pill = el('span', 'pill');
  r1.append(slot, acct, pill);

  const bot = el('div', 'bot');
  const units = el('div', 'units');
  const btns = el('div', 'btns');
  const ui = el('a', 'btn primary', 'Open bot UI'); ui.href = `http://localhost:${8010 + n}`; ui.target = '_blank';
  const b1 = el('button', null, 'Stop bot'); b1.onclick = () => act(n, 'stop-bot', 'bot stopped');
  const b2 = el('button', null, 'Restart RuneLite'); b2.onclick = () => { if (confirm(`Restart RuneLite in slot ${n}? The account will be logged out.`)) act(n, 'restart-client', 'RuneLite restarting'); };
  const b3 = el('button', null, 'Restart app'); b3.onclick = () => act(n, 'restart-app', 'bot app restarting');
  btns.append(ui, b1, b2, b3);
  const vnc = el('div', 'vnc', `VNC <code>localhost:${5900 + n}</code>`);

  body.append(r1, bot, units, btns, vnc);
  c.append(shot, body);
  grid.append(c);
  const card = { img, acct, pill, bot, units };
  cards.set(n, card);
  return card;
}

const UNIT_NAMES = { xvfb: 'screen', vnc: 'VNC', client: 'RuneLite', app: 'bot app' };

function render(slots) {
  const totals = { running: 0, paused: 0, idle: 0, offline: 0 };
  for (const s of slots) {
    const card = cards.get(s.slot) || makeCard(s.slot);
    const st = s.bot.status;
    totals[st] = (totals[st] || 0) + 1;
    card.acct.textContent = s.account || (s.window ? 'login screen' : 'no client');
    card.pill.textContent = st;
    card.pill.className = `pill s-${st}`;
    card.bot.innerHTML = s.bot.bot
      ? `${s.bot.bot.replace(/_/g, ' ')} <span class="rt">${s.bot.runtime || ''}</span>`
      : `<span class="rt">${st === 'offline' ? 'bot app not reachable' : 'no bot running'}</span>`;
    card.units.innerHTML = Object.entries(UNIT_NAMES)
      .map(([k, label]) => `<span><span class="dot ${s.units[k] === 'active' ? 'on' : ''}"></span>${label}</span>`).join('');
  }
  document.getElementById('totals').innerHTML =
    `<span><b>${totals.running}</b> running</span><span><b>${totals.paused || 0}</b> paused</span>` +
    `<span><b>${totals.idle}</b> idle</span><span><b>${totals.offline}</b> offline</span>`;
}

async function refresh() {
  try {
    const r = await fetch('/api/slots');
    render((await r.json()).slots);
  } catch { toast('Dashboard service not reachable'); }
}

function refreshShots() {
  const t = Date.now();
  for (const [n, card] of cards) card.img.src = `/shot/${n}.jpg?t=${t}`;
  if (bigSlot && document.getElementById('big').open) {
    document.getElementById('bigimg').src = `/shot/${bigSlot}.jpg?w=1280&t=${t}`;
    document.getElementById('bigcap').textContent = `Slot ${bigSlot}`;
  }
}

document.getElementById('big').addEventListener('click', e => e.currentTarget.close());
refresh().then(refreshShots);
setInterval(refresh, 4000);
setInterval(refreshShots, 3000);
</script>
</body>
</html>
